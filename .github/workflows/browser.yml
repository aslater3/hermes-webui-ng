name: Diagnostic browser gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix pwa --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-browser-results
          path: test-results/
          retention-days: 7
