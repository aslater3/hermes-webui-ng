name: Import captured dependency lockfile
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-lockfile.yml
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase0-reference-tooling
          run-id: 34749877033
          github-token: ${{ github.token }}
          path: /tmp/phase0-reference
      - name: Import the exact lockfile used for local validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('/tmp/phase0-reference/tooling/package-lock.json', 'utf8'));
          lock.name = manifest.name;
          lock.version = manifest.version;
          Object.assign(lock.packages[''], {
            name: manifest.name, version: manifest.version, license: manifest.license,
            devDependencies: manifest.devDependencies, engines: manifest.engines,
          });
          const content = Buffer.from(JSON.stringify(lock, null, 2) + '\n').toString('base64');
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/package-lock.json`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
          const previous = await fetch(url, { headers });
          if (!previous.ok && previous.status !== 404) throw new Error(`Read failed ${previous.status}`);
          const old = previous.ok ? await previous.json() : {};
          const response = await fetch(url, { method: 'PUT', headers, body: JSON.stringify({
            message: 'build: import verified Phase 0 dependency lockfile', content,
            branch: 'main', ...(old.sha ? {sha: old.sha} : {}),
          }) });
          if (!response.ok) throw new Error(`Contents write failed ${response.status}: ${await response.text()}`);
          console.log('Committed dependency lockfile');
          JS
