# Standalone alternative: docker compose -f compose.host.yaml up --build -d
services:
  webui:
    build: .
    image: hermes-webui-ng:phase0
    init: true
    user: "${WEBUI_UID:-10001}:${WEBUI_GID:-10001}"
    network_mode: host
    volumes:
      - ${WEBUI_TLS_DIR:-./.local/tls/server}:/run/webui-tls:ro
    environment:
      WEBUI_TLS_CERT: /run/webui-tls/server.crt
      WEBUI_TLS_KEY: /run/webui-tls/server.key
      WEBUI_TLS_CA: /run/webui-tls/ca.crt
      # Node's fetch/undici does not read WEBUI_TLS_CA; server-side requests to the
      # HTTPS public origin need this or they fail with UNABLE_TO_VERIFY_LEAF_SIGNATURE.
      # The repo's own integration tests assert it is set.
      NODE_EXTRA_CA_CERTS: /run/webui-tls/ca.crt
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:-http://127.0.0.1:9119}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact browser-facing origin}
      HOST: ${WEBUI_HOST:-127.0.0.1}
      PORT: ${WEBUI_PORT:-8788}
      HERMES_AUTH_MODE: ${HERMES_AUTH_MODE:-dashboard}
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
