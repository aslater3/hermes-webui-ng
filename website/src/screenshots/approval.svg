<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">HermesUI NG approval request preview</title>
  <desc id="desc">Prominent pending permission card with Allow once and Deny controls.</desc>
  <rect width="1180" height="720" rx="20" fill="#141719"/>
  <rect x="0" y="0" width="1180" height="58" rx="20" fill="#15191b"/><line x1="0" y1="58" x2="1180" y2="58" stroke="#303638"/>
  <text x="34" y="35" fill="#e9edeb" font-size="12" font-weight="650" font-family="Inter,Segoe UI,Arial">Release readiness</text><circle cx="1082" cy="29" r="4" fill="#addac5"/><text x="1094" y="33" fill="#a0aaa5" font-size="9" font-family="Inter,Segoe UI,Arial">Connected</text>
  <text x="84" y="112" fill="#a0aaa5" font-size="9" font-weight="650" font-family="Inter,Segoe UI,Arial">Agent activity</text>
  <rect x="84" y="128" width="1012" height="377" rx="16" fill="#2a261f" stroke="#e4b66c" stroke-width="2"/>
  <rect x="100" y="144" width="980" height="345" rx="13" fill="#2b271f" stroke="#5c4b30"/>
  <text x="124" y="186" fill="#e4b66c" font-size="18" font-weight="750" font-family="Inter,Segoe UI,Arial">Permission required</text>
  <rect x="124" y="203" width="247" height="30" rx="15" fill="#332b20" stroke="#8a6c3b"/><text x="247.5" y="222" text-anchor="middle" fill="#e4b66c" font-size="10" font-weight="700" font-family="Inter,Segoe UI,Arial">Action paused — choose Allow once or Deny</text>
  <text x="124" y="268" fill="#e9edeb" font-size="12" font-weight="650" font-family="Inter,Segoe UI,Arial">Hermes wants to run a command before continuing.</text>
  <rect x="124" y="290" width="932" height="75" rx="10" fill="#191d1f" stroke="#3b3a35"/>
  <text x="144" y="317" fill="#7f8a84" font-size="9" font-family="Inter,Segoe UI,Arial">COMMAND</text><text x="144" y="346" fill="#dce5df" font-size="13" font-family="SFMono-Regular,Consolas,monospace">npm run test:e2e:critical</text>
  <text x="124" y="396" fill="#a0aaa5" font-size="10" font-family="Inter,Segoe UI,Arial">This action is waiting on your explicit approval. Hermes has not executed it.</text>
  <rect x="124" y="426" width="142" height="47" rx="9" fill="#addac5"/><text x="195" y="455" text-anchor="middle" fill="#183329" font-size="11" font-weight="750" font-family="Inter,Segoe UI,Arial">Allow once</text>
  <rect x="276" y="426" width="116" height="47" rx="9" fill="#202427" stroke="#5a4744"/><text x="334" y="455" text-anchor="middle" fill="#f1a6a0" font-size="11" font-weight="650" font-family="Inter,Segoe UI,Arial">Deny</text>
  <rect x="156" y="545" width="868" height="48" rx="10" fill="#332b20" stroke="#e4b66c" stroke-width="2"/><circle cx="180" cy="569" r="5" fill="#e4b66c"/><text x="197" y="573" fill="#f1c987" font-size="11" font-weight="700" font-family="Inter,Segoe UI,Arial">1 request needs your input</text><text x="994" y="573" text-anchor="end" fill="#e4b66c" font-size="14" font-family="Inter,Segoe UI,Arial">↗</text>
  <rect x="156" y="607" width="868" height="84" rx="14" fill="#202427" stroke="#303638"/><text x="180" y="642" fill="#717d76" font-size="11" font-family="Inter,Segoe UI,Arial">Message Hermes…</text><circle cx="984" cy="666" r="17" fill="#2a2f31"/><text x="984" y="671" text-anchor="middle" fill="#6f7974" font-size="15" font-family="Inter,Segoe UI,Arial">↑</text>
</svg>
