<svg xmlns="http://www.w3.org/2000/svg" width="430" height="860" viewBox="0 0 430 860" role="img" aria-labelledby="title desc">
  <title id="title">HermesUI NG mobile preview</title>
  <desc id="desc">Responsive mobile conversation view with tool activity and composer.</desc>
  <rect width="430" height="860" rx="42" fill="#090c0b"/>
  <rect x="8" y="8" width="414" height="844" rx="36" fill="#141719" stroke="#303638"/>
  <rect x="160" y="18" width="110" height="23" rx="12" fill="#090c0b"/>
  <rect x="9" y="52" width="412" height="62" fill="#141719"/><line x1="9" y1="114" x2="421" y2="114" stroke="#303638"/>
  <text x="29" y="88" fill="#a0aaa5" font-size="20" font-family="Inter,Segoe UI,Arial">☰</text><text x="63" y="85" fill="#e9edeb" font-size="12" font-weight="650" font-family="Inter,Segoe UI,Arial">Release readiness</text><circle cx="359" cy="82" r="4" fill="#addac5"/><text x="373" y="86" fill="#a0aaa5" font-size="13" font-family="Inter,Segoe UI,Arial">⋯</text>
  <text x="27" y="154" fill="#85918a" font-size="8" font-weight="700" font-family="Inter,Segoe UI,Arial">YOU</text>
  <rect x="27" y="166" width="376" height="78" rx="12" fill="#28312d"/><text x="43" y="193" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">Check the release branch and tell me what</text><text x="43" y="211" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">still blocks deployment.</text><text x="43" y="229" fill="#9ba7a0" font-size="9" font-family="Inter,Segoe UI,Arial">Focus on CI and runtime safety.</text>
  <rect x="27" y="274" width="23" height="23" rx="7" fill="#addac5"/><text x="38.5" y="290" text-anchor="middle" fill="#183329" font-size="10" font-weight="800" font-family="Inter,Segoe UI,Arial">H</text><text x="59" y="289" fill="#e9edeb" font-size="10" font-weight="700" font-family="Inter,Segoe UI,Arial">Hermes</text>
  <text x="27" y="326" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">I found two release blockers. The agent/runtime</text><text x="27" y="344" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">boundary is clean; one browser gate and one</text><text x="27" y="362" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">deployment note still need attention.</text>
  <rect x="27" y="394" width="376" height="110" rx="12" fill="#202427" stroke="#303638"/><circle cx="51" cy="421" r="10" fill="#263c32"/><text x="51" y="425" text-anchor="middle" fill="#addac5" font-size="9" font-family="Inter,Segoe UI,Arial">◇</text><text x="70" y="423" fill="#e9edeb" font-size="10" font-weight="650" font-family="Inter,Segoe UI,Arial">github.compare_commits</text><text x="379" y="423" text-anchor="end" fill="#addac5" font-size="7" font-weight="700" font-family="Inter,Segoe UI,Arial">DONE</text><text x="51" y="455" fill="#a0aaa5" font-size="8" font-family="Inter,Segoe UI,Arial">main → release/next</text><text x="51" y="480" fill="#6f7a74" font-size="8" font-family="Inter,Segoe UI,Arial">4 files changed · 0.4s</text>
  <text x="27" y="545" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">I’d fix those two items, rerun the critical</text><text x="27" y="563" fill="#e9edeb" font-size="10" font-family="Inter,Segoe UI,Arial">browser path, then cut the build.</text>
  <rect x="19" y="664" width="392" height="148" rx="16" fill="#202427" stroke="#303638"/><text x="38" y="700" fill="#717d76" font-size="10" font-family="Inter,Segoe UI,Arial">Message Hermes…</text>
  <rect x="37" y="752" width="74" height="31" rx="8" fill="#191d1f" stroke="#303638"/><text x="74" y="771" text-anchor="middle" fill="#9aa59f" font-size="8" font-family="Inter,Segoe UI,Arial">default ▾</text><rect x="119" y="752" width="62" height="31" rx="8" fill="#191d1f" stroke="#303638"/><text x="150" y="771" text-anchor="middle" fill="#9aa59f" font-size="8" font-family="Inter,Segoe UI,Arial">High ▾</text><circle cx="374" cy="767" r="18" fill="#addac5"/><text x="374" y="773" text-anchor="middle" fill="#183329" font-size="16" font-family="Inter,Segoe UI,Arial">↑</text>
  <text x="215" y="834" text-anchor="middle" fill="#536059" font-size="7" font-family="Inter,Segoe UI,Arial">Your conversations stay in Hermes.</text>
