services:
  webui:
    build: .
    init: true
    image: hermes-webui-ng:phase0
    environment:
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:?Set an authenticated Dashboard origin}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact browser-facing origin}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${WEBUI_PORT:-8787}:8787'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
