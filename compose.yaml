services:
  webui:
    build: .
    init: true
    user: "${WEBUI_UID:-10001}:${WEBUI_GID:-10001}"
    image: hermes-webui-ng:phase0
    volumes:
      - ${WEBUI_TLS_DIR:-./.local/tls/server}:/run/webui-tls:ro
    environment:
      WEBUI_TLS_CERT: /run/webui-tls/server.crt
      WEBUI_TLS_KEY: /run/webui-tls/server.key
      WEBUI_TLS_CA: /run/webui-tls/ca.crt
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:?Set an authenticated Dashboard origin}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact browser-facing origin}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${WEBUI_PORT:-8787}:8787'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
